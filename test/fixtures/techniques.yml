seasoning_cast_iron:
  title: Getting cast iron non-stick
  body: Heat the pan until a few drops of water skitter around instead of evaporating immediately, then add oil.

basic_vinaigrette:
  title: Basic vinaigrette ratio
  body: "3 parts oil to 1 part vinegar, plus a spoonful of mustard as an emulsifier. Whisk or shake in a jar."
