# nosh — Docker Compose template.
#
# Copy this into your stack (plain `docker compose`, Arcane, Portainer, etc.),
# set the volume path, the `user:` UID:GID, and the secret, then deploy.
#
# ONE container runs both the web server and the background jobs: config/puma.rb
# boots the Solid Queue supervisor in-process whenever RAILS_ENV=production
# (baked into the image), so there's no separate worker service.
#
# No auth: nosh has no login system by design — see docs/adr/20260809-no-auth-needed.md.
# Only run it somewhere that isn't publicly reachable (a reverse proxy that
# resolves internally only, like this household's Caddy setup, or a LAN-only bind).
#
# Secrets are a plain env var, not Rails encrypted credentials, so the repo can
# be public without committing anything real: SECRET_KEY_BASE comes from the
# environment — see docs/adr/20260809-secrets-from-env.md. Keep the real value
# out of version control (set it only in your deployed copy).

services:
  nosh:
    image: ghcr.io/mm53bar/nosh:latest
    user: "1000:1000"                # UID:GID that owns the volume below (Synology: often 1027:100)
    restart: unless-stopped
    # `always` re-checks the registry on every `up`; use `missing` if the host
    # has no registry auth for a private image (avoids a failed manifest check).
    pull_policy: missing
    volumes:
      - /path/to/config:/rails/storage:rw   # SQLite DBs + recipe images — must persist
    ports:
      - "3004:8080"                  # host:container — the container port is fixed at 8080
    environment:
      TZ: UTC
      # Rails session/cookie signing key (required). Generate with: openssl rand -hex 64
      SECRET_KEY_BASE: replace-with-64-byte-hex
      # Optional, and usually unnecessary. The /kitchen screen is built to be
      # framed by a Home Assistant dashboard, and loopback origins are allowed
      # out of the box — a kiosk browser serves its dashboard from a port on the
      # device itself, so that covers the normal wall-panel case with no config.
      #
      # Set this only to frame nosh from a *named* host, e.g. opening the same
      # dashboard on a laptop. Comma-separated, and the value is the origin of
      # the parent page, scheme and port included — not nosh's own URL.
      # NOSH_FRAME_ANCESTORS: https://homeassistant.example
      #
      # Optional. Set these and nosh can push its shopping list into a Home
      # Assistant to-do list, so the list is reachable by voice and on whatever
      # screens HA already drives. Any integration behind the generic `todo`
      # domain works — local_todo, Bring!, Todoist, CalDAV, Google Tasks.
      #
      # Use HA's IP rather than a hostname: a hostname makes a call between two
      # machines on the same subnet depend on a reverse proxy.
      #
      # Mint the token as its OWN non-admin HA user. A long-lived token carries
      # its owner's permissions, so an owner's token would give nosh the house.
      # HA_BASE_URL: http://192.168.1.10:8123
      # HA_TOKEN: replace-with-a-long-lived-access-token
      # HA_TODO_ENTITY: todo.shopping_list
