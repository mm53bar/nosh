# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  # Sized for Puma's request threads *plus* Solid Queue's, which run in the same
  # process (config/puma.rb) — config/queue.yml gives workers 3 threads, and a
  # job touching a model checks out a primary connection even though Solid
  # Queue's own tables live in the queue database. 3 request + 3 job threads
  # against the stock 5 was an overcommit. `max_connections` is the Rails 8.1
  # key; `pool` is its deprecated alias.
  max_connections: <%= ENV.fetch("RAILS_MAX_CONNECTIONS") { Integer(ENV.fetch("RAILS_MAX_THREADS", 3)) + 6 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# Store production databases in the storage/ directory, which is a bind-mounted
# volume (see compose.yaml) so they persist across container restarts.
production:
  primary:
    <<: *default
    database: storage/production.sqlite3
  cache:
    <<: *default
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
